version: '3.8'

# ---------------------------------------------------------------------------
# VortexFlow - local development stack.
#
# Security posture:
#   * All sensitive values are read from the project-root ".env" file
#     (gitignored). Copy ".env.example" -> ".env", fill in the values, then
#     `docker compose up -d`. NO real secret is hardcoded in this file.
#   * The Program.cs startup guard will refuse to boot the .NET API if
#     Jwt__Secret / ConnectionStrings__Postgres / ApiKeys__Internal are
#     missing from the process environment.
#   * Postgres / Redis / RabbitMQ ports are bound to 127.0.0.1 ONLY. The
#     containers still talk to each other on the compose network; only
#     loopback host access is allowed for developer debugging.
#   * All images are pinned to immutable semver tags. For production
#     hardening, additionally pin the digest after `docker pull`:
#         image: timescale/timescaledb@sha256:<digest>
# ---------------------------------------------------------------------------

services:
  # Infrastructure
  postgres:
    image: timescale/timescaledb:2.14.1-pg15
    # Verified digest (2026-06-07): sha256:25c2b9802a0e7d58071276bd2161ef58a44dc81a65b652faa7b7a69e0c76c667
    # 2.14.2-pg15 has a broken shared_preload_libraries pointing to timescaledb-2.27.0 (unpackaged)
    # Pin to digest for production: image: timescale/timescaledb@sha256:25c2b9802a0e7d58071276bd2161ef58a44dc81a65b652faa7b7a69e0c76c667
    container_name: vortexflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      # Compose automatically reads `POSTGRES_PASSWORD_FILE` for the
      # official Postgres image, so we read the secret from a file in
      # the `secrets:` block below rather than passing it inline.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    # Bind ONLY to loopback so the database is not exposed on the LAN.
    # Other services reach postgres via the compose network on port 5432.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Default-deny: no extra capability, no host network.
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.2.5-alpine
    container_name: vortexflow-redis
    # Read the password from a file. The official redis image does not
    # natively read _FILE, so we wrap `redis-server` in a small entrypoint
    # that exports REDIS_PASSWORD from the file before exec.
    command:
      - /bin/sh
      - -c
      - |
        export REDIS_PASSWORD=$$(cat /run/secrets/redis_password)
        exec redis-server --requirepass "$$REDIS_PASSWORD"
    secrets:
      - redis_password
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: vortexflow-rabbitmq
    # RabbitMQ 3.13 deprecated RABBITMQ_DEFAULT_USER_FILE /
    # RABBITMQ_DEFAULT_PASS_FILE; setting them now produces a fatal
    # "deprecated environment variables detected" exit and the
    # container restart-loops. The replacement is the standard
    # RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS env vars. We use
    # a small entrypoint wrapper (docker/rabbitmq-entrypoint.sh) that
    # reads the secret files and exports the env vars, so the compose
    # file itself still contains no secret material. The entrypoint
    # override is given in exec (JSON array) form so the image's
    # default CMD is forwarded as args; the explicit `command:` is
    # needed because the docker-compose `entrypoint:` override clears
    # the inherited image CMD, which would leave the wrapper invoked
    # with no positional args (the rabbitmq image's docker-entrypoint.sh
    # uses `set -u` and crashes on "$1: unbound variable").
    entrypoint: ["/usr/local/bin/rabbitmq-entrypoint.sh"]
    command: ["rabbitmq-server"]
    secrets:
      - rabbitmq_user
      - rabbitmq_password
    ports:
      - "127.0.0.1:5672:5672"     # AMQP — loopback only
      - "127.0.0.1:15672:15672"   # Management UI — loopback only
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./docker/rabbitmq-entrypoint.sh:/usr/local/bin/rabbitmq-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Backend Services
  vortexflow-api:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
      # Build args let the CI/CD pipeline pin the build to a specific base
      # image digest. Locally we let the Dockerfile pick a stable tag.
    image: vortexflow/api:dev
    container_name: vortexflow-api
    ports:
      # Loopback binding: developers hit the API via the Vite proxy
      # (http://localhost:5173/api -> 127.0.0.1:5032). External exposure
      # is the responsibility of an ingress in production.
      - "127.0.0.1:5032:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    # Connection strings: the host/port parts are committed (they are
    # service names, not secrets). The credential parts use a custom
    # `PasswordFile=` / `passwordFile=` placeholder that the entrypoint
    # wrapper (docker/dotnet-entrypoint.sh) resolves to the plaintext
    # password read from the corresponding secret file mount. Npgsql,
    # StackExchange.Redis and RabbitMQ.Client do not understand this
    # placeholder natively; the wrapper substitutes the standard
    # `Password=` / `password=` / `amqp://user:pw@host/` forms at
    # container start. The compose file itself and the env vars in
    # the rendered compose remain free of plaintext passwords.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};PasswordFile=/run/secrets/postgres_password"
      ConnectionStrings__Redis: "redis:6379,passwordFile=/run/secrets/redis_password"
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_USER}:passwordFile=@rabbitmq:5672/"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__ValidAudience: ${JWT_AUDIENCE:-VortexFlowClient}
      Jwt__ValidIssuer: ${JWT_ISSUER:-VortexFlowApi}
      ApiKeys__Internal: ${API_KEY_INTERNAL:?API_KEY_INTERNAL is required}
      Bootstrap__SeedAdmin: ${BOOTSTRAP_SEED_ADMIN:-true}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-admin@vortexflow.local}
      # The .NET StartupConfigurationValidator reads the password from
      # the Bootstrap__AdminPassword env var, not the *_File convention
      # used elsewhere in this file. The value comes from the host's
      # .env (gitignored), so the compose file itself contains no
      # secret material. It WILL appear in `docker inspect` on this
      # container; for local dev this is acceptable. The secrets-file
      # mount for admin_password is kept for symmetry with the other
      # services and so a future PR adding a *_File-aware validator
      # path can switch back without touching the secrets block.
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
    secrets:
      - postgres_password
      - redis_password
      - rabbitmq_password
      - admin_password
    # Custom entrypoint that resolves the `PasswordFile=` /
    # `passwordFile=` placeholders in the connection strings by
    # reading the secret files. See docker/dotnet.Dockerfile (the
    # script is baked into the image, not bind-mounted, to avoid
    # Docker-Desktop-on-Windows bind-mount flakiness on shell
    # scripts).
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  vortexflow-worker:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    image: vortexflow/worker:dev
    container_name: vortexflow-worker
    # Worker has no inbound HTTP from the host, so no port mapping.
    environment:
      # Read broker URLs from a _FILE mount where possible so the
      # password never appears in `docker inspect`. REDIS_URL and
      # RABBITMQ_URL are loaded via a small entrypoint wrapper that
      # # substitutes the secrets at startup.
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      REDIS_URL_FILE: /run/secrets/redis_url
      DOTNET_INGEST_URL: "http://vortexflow-api:8080/api/trends/ingest"
      API_KEY_INTERNAL_FILE: /run/secrets/api_key_internal
      SCRAPING_INTERVAL_MINUTES: ${SCRAPING_INTERVAL_MINUTES:-5}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://otel-collector:4317}
    secrets:
      - rabbitmq_url
      - redis_url
      - api_key_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  # Frontend
  vortexflow-frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: vortexflow/frontend:dev
    container_name: vortexflow-frontend
    ports:
      - "127.0.0.1:5173:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      - vortexflow-api
    security_opt:
      - no-new-privileges:true

# ---------------------------------------------------------------------------
# Secrets — sourced from the host filesystem, never embedded in the
# compose file or its env. The CI/CD pipeline writes these files at
# deploy time (e.g. `docker compose --env-file .env up -d` after
# rendering templates). For local dev, you can use bind mounts from
# `~/.vortexflow/secrets/<name>` or the included `secrets/` dir.
# ---------------------------------------------------------------------------
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  rabbitmq_user:
    file: ./secrets/rabbitmq_user.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  rabbitmq_url:
    file: ./secrets/rabbitmq_url.txt
  redis_url:
    file: ./secrets/redis_url.txt
  admin_password:
    file: ./secrets/admin_password.txt
  api_key_internal:
    file: ./secrets/api_key_internal.txt

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:

# ---------------------------------------------------------------------------
# Network: an internal bridge that all services share. The `internal: false`
# default still allows outbound internet (for image pulls at runtime), but
# no port is published on the host except via the explicit 127.0.0.1
# mappings above.
# ---------------------------------------------------------------------------
networks:
  default:
    name: vortexflow-dev
