version: '3.8'

# ---------------------------------------------------------------------------
# VortexFlow - local development stack.
# All sensitive values are read from the project-root ".env" file (gitignored).
# Copy ".env.example" -> ".env", fill the values, then `docker compose up -d`.
# No real secret is hardcoded in this file. The Program.cs startup guard
# will refuse to boot the .NET API if Jwt__Secret / ConnectionStrings__Postgres
# / ApiKeys__Internal are missing.
# ---------------------------------------------------------------------------

services:
  # Infrastructure
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: vortexflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vortexflow-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vortexflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Services
  vortexflow-api:
    build:
      context: .
      dockerfile: docker/dotnet.Dockerfile
    container_name: vortexflow-api
    ports:
      - "5032:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Connection strings are built from individual env vars to avoid
      # placing the password in a single inline string. Postgres host points
      # to the compose service name; credentials come from secrets.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__ValidAudience: ${JWT_AUDIENCE:-VortexFlowClient}
      Jwt__ValidIssuer: ${JWT_ISSUER:-VortexFlowApi}
      ApiKeys__Internal: ${API_KEY_INTERNAL}
      Bootstrap__SeedAdmin: ${BOOTSTRAP_SEED_ADMIN:-true}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-admin@vortexflow.local}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  vortexflow-worker:
    build:
      context: .
      dockerfile: docker/python.Dockerfile
    container_name: vortexflow-worker
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      DOTNET_INGEST_URL: "http://vortexflow-api:8080/api/trends/ingest"
      API_KEY_INTERNAL: ${API_KEY_INTERNAL}
      SCRAPING_INTERVAL_MINUTES: ${SCRAPING_INTERVAL_MINUTES:-5}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://otel-collector:4317}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Frontend
  vortexflow-frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: vortexflow-frontend
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      - vortexflow-api

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
