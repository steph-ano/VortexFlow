version: '3.8'

# ---------------------------------------------------------------------------
# VortexFlow - optional observability stack.
# All images are pinned to immutable semver tags. For maximum hardening,
# additionally pin to a sha256 digest:
#     image: otel/opentelemetry-collector-contrib@sha256:<digest>
# ---------------------------------------------------------------------------

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    pull_policy: if_not_present
    container_name: vortexflow-otelcol
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./grafana/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    # OTLP endpoints are reached on the internal network only.
    expose:
      - "4317"
      - "4318"
      - "8888"
      - "8889"
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - vortexflow-network
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v2.54.1
    pull_policy: if_not_present
    container_name: vortexflow-prometheus
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - vortexflow-network
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:3.2.1
    pull_policy: if_not_present
    container_name: vortexflow-loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - vortexflow-network
    security_opt:
      - no-new-privileges:true

  tempo:
    image: grafana/tempo:2.5.0
    pull_policy: if_not_present
    container_name: vortexflow-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./grafana/tempo.yaml:/etc/tempo.yaml:ro
    expose:
      - "3200"
      - "4317"
      - "4318"
    networks:
      - vortexflow-network
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:10.4.3
    pull_policy: if_not_present
    container_name: vortexflow-grafana
    secrets:
      - grafana_admin_user
      - grafana_admin_password
    environment:
      GF_SECURITY_ADMIN_USER_FILE: /run/secrets/grafana_admin_user
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - vortexflow-network
    security_opt:
      - no-new-privileges:true

secrets:
  grafana_admin_user:
    file: /etc/vortexflow/secrets/grafana_admin_user
  grafana_admin_password:
    file: /etc/vortexflow/secrets/grafana_admin_password

volumes:
  prometheus_data:

networks:
  vortexflow-network:
    external: true
