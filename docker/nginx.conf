# Nginx configuration for the VortexFlow frontend SPA.
# Adds security headers (CSP, HSTS, X-Content-Type-Options, etc.) and disables
# clickjacking. The CSP allows inline styles only because the Vue/ECharts
# runtime uses dynamic styles; remove them in production if the build
# pipeline can be updated to avoid runtime style injection.

server {
    listen       80;
    server_name  _;

    # Security headers
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Cross-origin policies for the API
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # SPA routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively; never cache the index.html so deploys
    # take effect on the next reload.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location = /index.html {
        # The `root` must be set explicitly in this exact-match block because
        # nginx does NOT inherit the `root` from `location /`. Without this,
        # nginx falls back to the http-level default root (`/etc/nginx/html`)
        # and 404s on `/index.html` even though the file exists at the path
        # declared in `location /`.
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, max-age=0";
    }
}
