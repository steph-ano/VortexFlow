version: '3.8'

# ---------------------------------------------------------------------------
# VortexFlow - BETA stack (uses prebuilt GHCR images).
# No real secret is hardcoded: every credential comes from the project-root
# ".env" file (gitignored). Copy .env.example -> .env and fill the values
# before running `docker compose -f docker-compose.beta.yml up -d`.
# ---------------------------------------------------------------------------

services:
  # Infrastructure
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: vortexflow-postgres-beta
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vortexflow-redis-beta
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: vortexflow-rabbitmq-beta
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Services - Using GHCR Images
  api:
    image: ghcr.io/steph-ano/vortexflow/vortexflow-api:latest
    container_name: vortexflow-api-beta
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
      Jwt__Secret: ${JWT_SECRET}
      Jwt__ValidIssuer: ${JWT_ISSUER:-VortexFlowApi}
      Jwt__ValidAudience: ${JWT_AUDIENCE:-VortexFlowClient}
      ApiKeys__Internal: ${API_KEY_INTERNAL}
      Bootstrap__SeedAdmin: ${BOOTSTRAP_SEED_ADMIN:-false}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "5032:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/steph-ano/vortexflow/vortexflow-worker:latest
    container_name: vortexflow-worker-beta
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
      DOTNET_INGEST_URL: "http://api:8080/api/ingest"
      API_KEY_INTERNAL: ${API_KEY_INTERNAL}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://otel-collector:4317}
      HOSTNAME: "vortexflow-worker-beta"
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped

  frontend:
    image: ghcr.io/steph-ano/vortexflow/vortexflow-frontend:latest
    container_name: vortexflow-frontend-beta
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5032}
      VITE_WS_URL: ${VITE_WS_URL:-http://localhost:5032/hub}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  # Observability Stack (Optional)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: vortexflow-otel-beta
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./grafana/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:latest
    container_name: vortexflow-prometheus-beta
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:10.4.3
    container_name: vortexflow-grafana-beta
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:

networks:
  default:
    name: vortexflow-network-beta
