version: '3.8'

# ---------------------------------------------------------------------------
# VortexFlow - BETA stack (uses prebuilt GHCR images).
# Pre-prod environment. No `:latest` tags — every image is pinned to a
# semver. For production hardening, additionally pin to a sha256 digest:
#     image: ghcr.io/steph-ano/vortexflow/vortexflow-api@sha256:<digest>
# All sensitive values come from host files via the `secrets:` block —
# the compose file itself contains no plaintext credentials.
# ---------------------------------------------------------------------------

services:
  # Infrastructure
  postgres:
    image: timescale/timescaledb:2.14.2-pg16
    container_name: vortexflow-postgres-beta
    environment:
      POSTGRES_DB_FILE: /run/secrets/postgres_db
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_db
      - postgres_user
      - postgres_password
    # Internal only — no host port mapping in beta either. Developers
    # who need to poke at the DB should `docker exec` into the container.
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d $$(cat /run/secrets/postgres_db)"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.2.5-alpine
    container_name: vortexflow-redis-beta
    command:
      - /bin/sh
      - -c
      - |
        export REDIS_PASSWORD=$$(cat /run/secrets/redis_password)
        exec redis-server --requirepass "$$REDIS_PASSWORD"
    secrets:
      - redis_password
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: vortexflow-rabbitmq-beta
    environment:
      RABBITMQ_DEFAULT_USER_FILE: /run/secrets/rabbitmq_user
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    secrets:
      - rabbitmq_user
      - rabbitmq_password
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Application Services - Using pinned GHCR Images
  api:
    image: ghcr.io/steph-ano/vortexflow/vortexflow-api:0.1.0
    pull_policy: if_not_present
    container_name: vortexflow-api-beta
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;DatabaseFile=/run/secrets/postgres_db;UsernameFile=/run/secrets/postgres_user;PasswordFile=/run/secrets/postgres_password"
      ConnectionStrings__Redis: "redis:6379,passwordFile=/run/secrets/redis_password"
      ConnectionStrings__RabbitMq: "amqp://userFile=@rabbitmq:5672/"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET is required}
      Jwt__ValidIssuer: ${JWT_ISSUER:-VortexFlowApi}
      Jwt__ValidAudience: ${JWT_AUDIENCE:-VortexFlowClient}
      ApiKeys__Internal: ${API_KEY_INTERNAL:?API_KEY_INTERNAL is required}
      Bootstrap__SeedAdmin: "false"
      Bootstrap__AdminEmail: ""
      Bootstrap__AdminPassword: ""
    secrets:
      - postgres_db
      - postgres_user
      - postgres_password
      - redis_password
      - rabbitmq_url
    ports:
      - "127.0.0.1:5032:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  worker:
    image: ghcr.io/steph-ano/vortexflow/vortexflow-worker:0.1.0
    pull_policy: if_not_present
    container_name: vortexflow-worker-beta
    environment:
      REDIS_URL_FILE: /run/secrets/redis_url
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
      DOTNET_INGEST_URL: "http://api:8080/api/ingest"
      API_KEY_INTERNAL_FILE: /run/secrets/api_key_internal
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://otel-collector:4317}
      HOSTNAME: "vortexflow-worker-beta"
    secrets:
      - redis_url
      - rabbitmq_url
      - api_key_internal
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ghcr.io/steph-ano/vortexflow/vortexflow-frontend:0.1.0
    pull_policy: if_not_present
    container_name: vortexflow-frontend-beta
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5032}
      VITE_WS_URL: ${VITE_WS_URL:-http://localhost:5032/hub}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Observability Stack (Optional)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    pull_policy: if_not_present
    container_name: vortexflow-otel-beta
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./grafana/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    # Exposed only on the internal network — the collector has no business
    # accepting scrapes from the public internet.
    expose:
      - "4317"
      - "4318"
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v2.54.1
    pull_policy: if_not_present
    container_name: vortexflow-prometheus-beta
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:10.4.3
    pull_policy: if_not_present
    container_name: vortexflow-grafana-beta
    secrets:
      - grafana_admin_user
      - grafana_admin_password
    environment:
      GF_SECURITY_ADMIN_USER_FILE: /run/secrets/grafana_admin_user
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

# ---------------------------------------------------------------------------
# Secrets — every sensitive value is read from a host-side file under
# /etc/vortexflow/secrets/ (or wherever the operator chooses to mount).
# ---------------------------------------------------------------------------
secrets:
  postgres_db:
    file: /etc/vortexflow/secrets/postgres_db
  postgres_user:
    file: /etc/vortexflow/secrets/postgres_user
  postgres_password:
    file: /etc/vortexflow/secrets/postgres_password
  redis_password:
    file: /etc/vortexflow/secrets/redis_password
  redis_url:
    file: /etc/vortexflow/secrets/redis_url
  rabbitmq_user:
    file: /etc/vortexflow/secrets/rabbitmq_user
  rabbitmq_password:
    file: /etc/vortexflow/secrets/rabbitmq_password
  rabbitmq_url:
    file: /etc/vortexflow/secrets/rabbitmq_url
  api_key_internal:
    file: /etc/vortexflow/secrets/api_key_internal
  grafana_admin_user:
    file: /etc/vortexflow/secrets/grafana_admin_user
  grafana_admin_password:
    file: /etc/vortexflow/secrets/grafana_admin_password

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:

networks:
  default:
    name: vortexflow-network-beta
    driver: bridge
