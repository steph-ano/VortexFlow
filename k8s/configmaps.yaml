# ---------------------------------------------------------------------------
# VortexFlow - non-sensitive ConfigMaps.
# This file is SAFE to commit. No password, no API key, no JWT secret.
# All sensitive values are sourced from `vortexflow-secrets` (see
# k8s/secrets.yaml, populated via External Secrets Operator / Sealed
# Secrets / SOPS in real environments).
# ---------------------------------------------------------------------------
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vortexflow-api-config
  namespace: vortexflow
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Jwt__ValidAudience: "VortexFlowClient"
  Jwt__ValidIssuer: "VortexFlowApi"
  Otlp__Endpoint: "http://otel-collector:4317"
  # In production we never auto-seed an admin. The operator must bootstrap
  # the first admin out-of-band (CLI, init job, etc.).
  Bootstrap__SeedAdmin: "false"
  Bootstrap__AdminEmail: ""
  Bootstrap__AdminPassword: ""
  # ConnectionStrings__Postgres / __Redis / __RabbitMq are intentionally
  # OMITTED from this ConfigMap. They live in `vortexflow-secrets` and are
  # injected into the pod via `secretRef` in services.yaml.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vortexflow-worker-config
  namespace: vortexflow
data:
  # Worker has no business holding connection strings with credentials in
  # the ConfigMap. Only non-sensitive knobs are exposed here.
  DOTNET_INGEST_URL: "http://vortexflow-api:8080/api/trends/ingest"
  OTLP_ENDPOINT: "http://otel-collector:4317"
  SCRAPING_INTERVAL_MINUTES: "5"
  HOSTNAME: "vortexflow-worker"
  # DATABASE_URL / REDIS_URL / RABBITMQ_URL / API_KEY_INTERNAL are injected
  # from `vortexflow-secrets` via `secretRef` in services.yaml.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vortexflow-frontend-config
  namespace: vortexflow
data:
  VITE_API_BASE_URL: "/api"
