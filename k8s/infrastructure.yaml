---
# Postgres — headless Service backed by a StatefulSet for stable identity
# and per-pod PVC. Port 5432 is only reachable on the cluster network.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vortexflow
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: vortexflow
  labels:
    app: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Default-deny egress forces any cross-pod traffic to be granted
      # explicitly by a NetworkPolicy. Postgres only ever needs DNS.
      containers:
        - name: postgres
          # Pinned semver. For maximum immutability, additionally pin
          # the digest after pulling the image:
          #   image: timescale/timescaledb@sha256:<digest>
          image: timescale/timescaledb:2.14.1-pg15
          # Verified digest (2026-06-07): sha256:25c2b9802a0e7d58071276bd2161ef58a44dc81a65b652faa7b7a69e0c76c667
          # 2.14.2-pg15 has a broken shared_preload_libraries pointing to timescaledb-2.27.0 (unpackaged)
          # Pin to digest: image: timescale/timescaledb@sha256:25c2b9802a0e7d58071276bd2161ef58a44dc81a65b652faa7b7a69e0c76c667
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: vortexflow-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vortexflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vortexflow-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "vortexflow_user", "-d", "vortexflow_db"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vortexflow_user", "-d", "vortexflow_db"]
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: false   # postgres image runs as the `postgres` uid
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# Redis — single replica is fine for the cache; a Sentinel/Cluster setup
# would replace this in a real HA deployment.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: vortexflow
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vortexflow
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          # Pinned semver. To pin to a digest:
          #   image: redis@sha256:<digest>
          image: redis:7.2.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
          # The redis image does not natively read REDIS_PASSWORD_FILE, so
          # the password is exported via a tiny init container; here we
          # read directly from the Secret as an env var and rely on the
          # pod-level `enableServiceLinks: false` to keep the secret out
          # of the service-link env.
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vortexflow-secrets
                  key: REDIS_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              exec redis-server --requirepass "$$REDIS_PASSWORD"
          volumeMounts:
            - name: redisdata
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: redisdata
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: vortexflow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# RabbitMQ — headless service + StatefulSet. Only AMQP (5672) is
# exposed internally; the management UI (15672) is not.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: vortexflow
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: vortexflow
  labels:
    app: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          # Pinned semver. To pin to a digest:
          #   image: rabbitmq@sha256:<digest>
          image: rabbitmq:3.13.7-management-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: vortexflow-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: vortexflow-secrets
                  key: RABBITMQ_DEFAULT_PASS
          volumeMounts:
            - name: rabbitmqdata
              mountPath: /var/lib/rabbitmq
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: rabbitmqdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
