---
# All application deployments pin to immutable semver tags. For maximum
# hardening, additionally pin to a sha256 digest after pulling the image:
#   image: ghcr.io/stu-organizacion/vortexflow-api@sha256:<digest>
# and set imagePullPolicy: IfNotPresent (the default for pinned tags).
---
apiVersion: v1
kind: Service
metadata:
  name: vortexflow-api
  namespace: vortexflow
  labels:
    app: vortexflow-api
spec:
  selector:
    app: vortexflow-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vortexflow-api
  namespace: vortexflow
  labels:
    app: vortexflow-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: vortexflow-api
  template:
    metadata:
      labels:
        app: vortexflow-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: api
          # Pinned semver. To pin to a digest:
          #   image: ghcr.io/tu-organizacion/vortexflow-api@sha256:<digest>
          image: ghcr.io/tu-organizacion/vortexflow-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vortexflow-api-config
            - secretRef:
                name: vortexflow-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: vortexflow-worker
  namespace: vortexflow
  labels:
    app: vortexflow-worker
spec:
  selector:
    app: vortexflow-worker
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vortexflow-worker
  namespace: vortexflow
  labels:
    app: vortexflow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vortexflow-worker
  template:
    metadata:
      labels:
        app: vortexflow-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: worker
          # Pinned semver. To pin to a digest:
          #   image: ghcr.io/tu-organizacion/vortexflow-worker@sha256:<digest>
          image: ghcr.io/tu-organizacion/vortexflow-worker:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: vortexflow-worker-config
            - secretRef:
                name: vortexflow-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: vortexflow-frontend
  namespace: vortexflow
  labels:
    app: vortexflow-frontend
spec:
  selector:
    app: vortexflow-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vortexflow-frontend
  namespace: vortexflow
  labels:
    app: vortexflow-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vortexflow-frontend
  template:
    metadata:
      labels:
        app: vortexflow-frontend
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: frontend
          # Pinned semver. To pin to a digest:
          #   image: ghcr.io/tu-organizacion/vortexflow-frontend@sha256:<digest>
          image: ghcr.io/tu-organizacion/vortexflow-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: vortexflow-frontend-config
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
