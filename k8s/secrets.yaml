apiVersion: v1
kind: Secret
metadata:
  name: vortexflow-secrets
  namespace: vortexflow
  annotations:
    # -----------------------------------------------------------------------
    # SECURITY NOTICE — DO NOT COMMIT REAL VALUES TO THIS FILE.
    # -----------------------------------------------------------------------
    # The block below is intentionally EMPTY. This manifest is committed to
    # version control as a STRUCTURAL REFERENCE only.
    #
    # To populate this Secret in a real cluster, prefer one of:
    #
    #   1) External Secrets Operator (recommended)
    #      https://external-secrets.io/
    #      - Define an ExternalSecret that syncs from AWS Secrets Manager,
    #        GCP Secret Manager, Azure Key Vault, HashiCorp Vault, etc.
    #      - This manifest stays empty in git forever.
    #
    #   2) Sealed Secrets (Bitnami)
    #      https://github.com/bitnami-labs/sealed-secrets
    #      - Encrypt locally with kubeseal, commit the SealedSecret manifest.
    #
    #   3) SOPS + age (Mozilla)
    #      https://github.com/getsops/sops
    #      - Encrypt the values in-place with `sops --encrypt`.
    #
    # For ad-hoc local clusters, you may apply a NON-COMMITTED override file:
    #   kubectl create secret generic vortexflow-secrets \
    #     --from-env-file=.env.production \
    #     -n vortexflow
    # -----------------------------------------------------------------------
type: Opaque
stringData: {}
  # Expected keys (provided by the operator at apply time):
  #
  # ---- .NET API / Worker shared secrets ----
  # Jwt__Secret:           "<openssl rand -base64 48>"   # >= 32 chars
  # ApiKeys__Internal:     "<openssl rand -base64 48>"   # >= 32 chars
  # Bootstrap__AdminEmail: "admin@example.com"
  # Bootstrap__AdminPassword: "<strong random>"         # only if SeedAdmin=true
  #
  # ---- PostgreSQL ----
  # POSTGRES_DB:        vortexflow_db
  # POSTGRES_USER:      vortexflow_user
  # POSTGRES_PASSWORD:  "<strong random>"
  # ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=vortexflow_db;Username=vortexflow_user;Password=..."
  #
  # ---- Redis ----
  # REDIS_PASSWORD:                  "<strong random>"
  # ConnectionStrings__Redis:       "redis:6379,password=..."
  #
  # ---- RabbitMQ ----
  # RABBITMQ_DEFAULT_USER:           "vortexflow"
  # RABBITMQ_DEFAULT_PASS:           "<strong random>"
  # ConnectionStrings__RabbitMq:     "amqp://vortexflow:...@rabbitmq:5672/"
  #
  # ---- Python worker ----
  # DATABASE_URL:     "postgresql://vortexflow_user:...@postgres:5432/vortexflow_db"
  # REDIS_URL:        "redis://:...@redis:6379/0"
  # RABBITMQ_URL:     "amqp://vortexflow:...@rabbitmq:5672/"
  # API_KEY_INTERNAL: "<same as ApiKeys__Internal above>"
